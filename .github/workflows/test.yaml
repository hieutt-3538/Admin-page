name: Test CI Workflow

on:
  push:
    branches:
      - Backend

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backend

      - name: List files after sparse checkout
        run: ls -la

      # Bước 3: Sử dụng Action Cục bộ (Local Action) <--- PHẦN QUAN TRỌNG
      - name: Run my local action
      # 'uses:' trỏ đến đường dẫn tương đối của thư mục chứa action.yml cục bộ
        uses: ./.github/actions
        # 'with:' dùng để truyền giá trị cho các 'inputs:' đã định nghĩa trong action.yml cục bộ
        with:
          input-greeting: "Xin chào từ Workflow gọi Local Action!" # Giá trị này sẽ được gán cho inputs.input-greeting        