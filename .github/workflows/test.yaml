name: Test CI Workflow

on:
  push:
    branches:
      - main

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          echo "Install dependencies ..."
          npm install

      - name: Run tests
        run: |
          echo "Run tests ..."
          npm test
          
      - name: Build application
        run: |
          echo "Build application ..."
          npm run build
