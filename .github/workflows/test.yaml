name: Test CI Workflow

on:
  push:
    branches:
      - Backend

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [14, 16, 18]    
    env:
      NODE_VER: 18
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Use Node  
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VER }}

      - name: Install dependencies
        run: |
          echo "Install dependencies ..." 
          node -v
          cd backend/
          npm install

      - name: Run tests
        env: 
          LOCAL_VAR: "Hello Step run test"
        run: |
          echo "Run Local Var $LOCAL_VAR "

      - name: Set Environment Variable
        run: |
          echo "MY_DYNAMIC_VAR=123" >> $GITHUB_ENV 

      - name: Use Environment Variable
        run: |
          echo "The value is: $MY_DYNAMIC_VAR"                 

      - name: Use Secret
        run: |
          echo "My secret is ${{ secrets.API_KEY }}"
          echo "::debug::$API_KEY"

      - name: Use Repository Variable
        run: |
          echo "Repo Variable: ${{ vars.MY_VARIABLE }}"

      - name: Print Node Version
        run: |
          echo "Testing on Node.js version ${{ matrix.node-version }}"          
