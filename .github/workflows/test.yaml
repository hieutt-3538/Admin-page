name: Test CI Workflow

on:
  push:
    branches:
      - Backend

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            backend

      - name: List files after sparse checkout
        run: ls -laR

      - name: Dependencies install
        working-directory: ./backend
        run: |
          echo "Dependencies install process"
          npm install
          echo "Dependencies install success"
