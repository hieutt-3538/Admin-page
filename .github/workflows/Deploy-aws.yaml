# .github/workflows/deploy-s3-oidc.yml

name: Deploy Static Site to S3 via OIDC

on:
  push:
    branches: [ Frontend ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Static Files
        working-directory: ./frontend
        run: npm run build # Giả sử lệnh này tạo ra thư mục 'build'

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: static-site-files
          path: ./build # Đường dẫn đến thư mục chứa kết quả build

  deploy:
    name: Deploy to S3
    runs-on: ubuntu-latest
    needs: build # Chạy sau khi build thành công

    # (Tùy chọn) Liên kết với GitHub Environment
    # environment:
    #   name: production
    #   url: https://your-website-url.com

    permissions: # Có thể đặt ở đây hoặc ở cấp workflow
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: static-site-files
          path: ./deploy-files # Tải artifact vào thư mục này

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_OIDC }}
          aws-region: eu-east-1 # Thay Region

      - name: Deploy to S3 Bucket
        run: aws s3 sync ./deploy-files s3://hieutt-testbucket --delete # Sync từ thư mục đã download artifact
        # Đảm bảo Role có quyền s3:PutObject, s3:DeleteObject, s3:ListBucket trên bucket này

      - name: Invalidate CloudFront Cache (Optional)
        if: success()
        run: aws cloudfront create-invalidation --distribution-id YOUR_CF_DIST_ID --paths "/*"
        # Đảm bảo Role có quyền cloudfront:CreateInvalidation

      - name: Deployment Successful
        run: echo "✅ Static site deployed successfully!"