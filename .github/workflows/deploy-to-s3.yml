name: Upload source to S3
on:
  push:
    branches:
      - develop
      - main
env:
  ZIP_FILE: source.zip
jobs:
  configure-env:
    runs-on: ubuntu-latest
    outputs:  
      environment: ${{ steps.config.outputs.environment }}
    steps:
    - id: config
      name: Config environment base on github branch
      run: |
        if [ "${{ github.ref_name }}" == "develop" ] ; then
            echo "env=dev" >> "$GITHUB_OUTPUT"
            echo "environment=develop" >> "$GITHUB_OUTPUT"
        elif [ "${{ github.ref_name }}" == "main" ] ; then
            echo "env=main" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
        else
            echo "no flag"
        fi
  upload-to-s3:
    runs-on: ubuntu-latest
    needs: configure-env
    environment:  ${{ needs.configure-env.outputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Print environment
        run: echo "Environment is ${{ needs.configure-env.outputs.environment }}"
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Echo environment variables
        run: |
          echo "AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}"
          echo "AWS_ROLE_NAME: ${{ secrets.AWS_ROLE_NAME }}"
      - name: Compress the source code into a zip file
        run: |
          cd backend     
          ls -l
          zip -r ${{ env.ZIP_FILE }} .
      - name: Configure AWS to use OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/${{ secrets.AWS_ROLE_NAME }}
          aws-region: us-east-1
      - name: Upload to S3
        run: |
          cd backend
          aws s3 cp ${{ env.ZIP_FILE }} s3://${{ secrets.S3_SOURCE_CODE_ADMIN_BACKEND }}/
